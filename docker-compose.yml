services:
  db:
    image: postgres:16
    container_name: brujula_db
    environment:
      POSTGRES_USER: ${PGUSER:-brujula}
      POSTGRES_PASSWORD: ${PGPASSWORD:-brujula_dev}
      POSTGRES_DB: ${PGDATABASE:-brujula_vocacional}
    ports:
      - '${PGPORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
